<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RAJ MISHRA — WhatsApp Bot Controller</title>
<style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
        background: linear-gradient(135deg, #fff8f5 0%, #ffe4ec 50%, #fff5e1 100%);
        background-attachment: fixed;
        color: #4a3f3f;
        margin: 0;
        padding: 20px;
        display: flex;
        justify-content: center;
        min-height: 100vh;
    }
    .container {
        max-width: 960px; width: 100%;
        background: #ffffff;
        border-radius: 20px;
        padding: 30px;
        box-shadow: 0 10px 40px rgba(255, 107, 157, 0.15), 0 4px 12px rgba(0,0,0,0.05);
        border: 2px solid #ffe4ec;
    }
    .brand {
        text-align: center;
        padding-bottom: 18px;
        border-bottom: 2px dashed #ffc4d6;
        margin-bottom: 24px;
    }
    .brand h1 {
        margin: 0; font-size: 32px; letter-spacing: 2px;
        background: linear-gradient(90deg, #ff6b9d, #ff8fab, #ffb3c6);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        background-clip: text; font-weight: 800;
    }
    .brand .sub {
        color: #a88a92; font-size: 12px; letter-spacing: 3px;
        margin-top: 6px; font-weight: 600;
    }
    .brand .emoji { font-size: 28px; }
    h2 {
        color: #d6336c; margin-top: 28px;
        padding-left: 10px; border-left: 4px solid #ff6b9d; font-size: 18px;
    }
    .form-group { margin-bottom: 18px; }
    label {
        display: block; font-weight: 600; margin-bottom: 8px;
        color: #7a5c68; font-size: 13px;
    }
    input, select, textarea {
        width: 100%; padding: 12px 16px;
        border: 2px solid #ffe4ec; border-radius: 10px;
        background: #fffdfd; color: #4a3f3f;
        font-size: 14px; transition: 0.2s;
    }
    input:focus, select:focus, textarea:focus {
        border-color: #ff6b9d; outline: none;
        box-shadow: 0 0 0 4px rgba(255, 107, 157, 0.12);
        background: #ffffff;
    }
    textarea { min-height: 110px; resize: vertical; }
    .row { display: flex; gap: 15px; flex-wrap: wrap; }
    .row .form-group { flex: 1; min-width: 180px; }
    .btn {
        background: linear-gradient(135deg, #ff6b9d, #ff8fab);
        color: #fff; font-weight: 700; border: none;
        cursor: pointer; padding: 13px 22px;
        border-radius: 10px; font-size: 15px;
        transition: 0.25s;
        box-shadow: 0 4px 12px rgba(255, 107, 157, 0.3);
        letter-spacing: 0.5px;
    }
    .btn:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 6px 18px rgba(255, 107, 157, 0.45);
    }
    .btn:disabled {
        background: #e0d5d9; cursor: not-allowed;
        box-shadow: none; color: #fff;
    }
    .btn-secondary {
        background: #fff; color: #d6336c;
        border: 2px solid #ffc4d6; box-shadow: none;
    }
    .btn-secondary:hover:not(:disabled) { background: #ffe4ec; }
    .btn-danger {
        background: linear-gradient(135deg, #e53935, #ff5252);
        box-shadow: 0 4px 12px rgba(229, 57, 53, 0.3);
    }
    .btn-sm { padding: 8px 14px; font-size: 13px; }
    .btn-group {
        display: flex; gap: 12px; flex-wrap: wrap; margin-top: 12px;
    }
    .btn-group .btn { flex: 1; min-width: 120px; }
    #groupListContainer {
        background: #fffdfd; padding: 8px;
        border-radius: 10px; max-height: 220px;
        overflow-y: auto; margin-top: 10px;
        border: 2px solid #ffe4ec;
    }
    .group-item {
        padding: 10px 14px; cursor: pointer;
        border-radius: 8px; transition: 0.15s;
        border-bottom: 1px solid #fff0f5; font-size: 13px;
    }
    .group-item:hover { background: #fff0f5; }
    .group-item.selected {
        background: linear-gradient(90deg, #ffe4ec, #fff0f5);
        border-left: 4px solid #ff6b9d; font-weight: 600;
    }
    #pairingCodeDisplay {
        background: linear-gradient(135deg, #ff6b9d, #ff8fab);
        color: #fff; font-size: 26px; text-align: center;
        padding: 20px; border-radius: 14px; margin: 16px 0;
        letter-spacing: 5px; font-weight: 800; display: none;
        box-shadow: 0 8px 24px rgba(255, 107, 157, 0.35);
        animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.02); }
    }
    #connectionStatus {
        margin-top: 10px; padding: 10px 14px;
        border-radius: 10px; font-size: 13px; font-weight: 600;
        background: #fff8e1; border: 2px solid #ffe082;
        color: #b47c00; transition: 0.3s;
    }
    #connectionStatus.connected {
        background: #e8f5e9; border-color: #a5d6a7; color: #2e7d32;
    }
    .task-list { margin-top: 10px; }
    .task-card {
        background: #fffdfd; border: 2px solid #ffe4ec;
        border-radius: 14px; padding: 16px; margin-bottom: 12px;
        transition: 0.2s;
    }
    .task-card:hover { box-shadow: 0 6px 20px rgba(255, 107, 157, 0.15); }
    .task-card.running { border-left: 5px solid #4caf50; }
    .task-card.stopped { border-left: 5px solid #b0a0a5; opacity: 0.85; }
    .task-header {
        display: flex; justify-content: space-between;
        align-items: center; margin-bottom: 10px;
        flex-wrap: wrap; gap: 8px;
    }
    .task-id {
        font-family: 'Courier New', monospace;
        font-weight: 800; color: #d6336c;
        font-size: 15px; letter-spacing: 1px;
    }
    .task-badge {
        padding: 4px 12px; border-radius: 20px;
        font-size: 11px; font-weight: 700; letter-spacing: 1px;
    }
    .badge-running { background: #e8f5e9; color: #2e7d32; }
    .badge-stopped { background: #f5f5f5; color: #888; }
    .badge-starting { background: #fff8e1; color: #b47c00; }
    .task-info {
        display: flex; flex-wrap: wrap; gap: 14px;
        font-size: 13px; color: #7a5c68; margin-bottom: 12px;
    }
    .task-info span b { color: #4a3f3f; }
    .task-logs {
        background: #fffaf0; border-radius: 8px; padding: 10px;
        max-height: 200px; overflow-y: auto;
        font-family: 'Courier New', monospace; font-size: 12px;
        white-space: pre-wrap; word-wrap: break-word;
        margin-top: 10px; border: 1px solid #ffe4ec; display: none;
    }
    .task-logs.open { display: block; }
    .log-container {
        background: #fffaf0; border-radius: 12px; padding: 16px;
        max-height: 320px; overflow-y: auto;
        font-family: 'Courier New', monospace; font-size: 13px;
        white-space: pre-wrap; word-wrap: break-word;
        border: 2px solid #ffe4ec; margin-top: 10px;
    }
    .log-entry { padding: 3px 0; border-bottom: 1px solid #fff0f5; }
    .log-success { color: #2e7d32; }
    .log-error { color: #c62828; }
    .log-warn { color: #ef6c00; }
    .log-info { color: #1976d2; }
    .footer {
        margin-top: 30px; text-align: center;
        color: #b0a0a5; font-size: 12px;
        padding-top: 16px; border-top: 1px dashed #ffe4ec;
    }
    .footer b {
        background: linear-gradient(90deg, #ff6b9d, #ff8fab);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text; font-weight: 800; letter-spacing: 1px;
    }
    @media (max-width: 600px) {
        .container { padding: 18px; }
        .row { flex-direction: column; gap: 0; }
        .brand h1 { font-size: 22px; }
    }
</style>
</head>
<body>
<div class="container">

    <div class="brand">
        <div class="emoji">💗🤖💗</div>
        <h1>RAJ MISHRA</h1>
        <div class="sub">WHATSAPP BOT CONTROLLER</div>
    </div>

    <div id="pairingCodeDisplay">🔑 PAIRING CODE: <span id="pairingCode"></span></div>

    <h2>① Connect WhatsApp</h2>
    <div class="form-group">
        <label>📞 Your WhatsApp Number (with country code)</label>
        <div style="display:flex; gap:10px;">
            <input type="text" id="phoneNumber" placeholder="911234567890" style="flex:1;" />
            <button class="btn" id="connectBtn" style="width:auto; white-space:nowrap;">🔌 Connect & Pair</button>
        </div>
        <div id="connectionStatus">⚠️ Bot not connected. Pehle pairing karo.</div>
    </div>

    <h2>② Select Target</h2>
    <div class="row">
        <div class="form-group">
            <label>🎯 Target Type</label>
            <select id="targetType">
                <option value="number">Phone Number (Inbox)</option>
                <option value="group">WhatsApp Group</option>
            </select>
        </div>
        <div class="form-group" id="targetNumberGroup">
            <label>📱 Target Phone Number</label>
            <input type="text" id="targetNumber" placeholder="911234567890" />
        </div>
    </div>

    <div id="groupSelector" style="display:none;">
        <div class="form-group">
            <label>👥 Select Group</label>
            <button class="btn btn-secondary" id="fetchGroupsBtn">🔄 Fetch My Groups</button>
            <div id="groupListContainer"></div>
            <input type="hidden" id="selectedGroupJid" />
        </div>
    </div>

    <h2>③ Messages</h2>
    <div class="form-group">
        <label>📝 Message Prefix</label>
        <input type="text" id="msgPrefix" placeholder="e.g. [RAJ]" />
    </div>
    <div class="form-group">
        <label>📄 Message Lines (one per line)</label>
        <textarea id="messageLines" placeholder="Hello!&#10;How are you?"></textarea>
        <div style="margin-top:6px; font-size:13px; color:#a88a92;">
            Or upload .txt:
            <input type="file" id="fileUpload" accept=".txt"
                   style="display:inline-block; width:auto; padding:6px; background:transparent; border:none;" />
        </div>
    </div>
    <div class="form-group">
        <label>⏱️ Delay between messages (seconds)</label>
        <input type="number" id="delaySec" value="5" min="1" />
    </div>

    <div class="btn-group">
        <button class="btn" id="startBtn" disabled>▶️ START SENDING</button>
        <button class="btn btn-danger" id="stopBotBtn" style="display:none;">⏹️ STOP BOT</button>
    </div>

    <h2>📋 Tasks</h2>
    <div class="task-list" id="taskList">
        <div style="color:#b0a0a5; font-size:13px; padding:10px;">No tasks yet.</div>
    </div>

    <h2>📜 Live Logs</h2>
    <div class="log-container" id="logContainer"></div>

    <div class="footer">
        💗 DEVELOPED BY <b>RAJ MISHRA</b> 💗<br>
        <span style="font-size:11px;">Health: <a href="/health" target="_blank" style="color:#ff6b9d;">/health</a></span>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();

const phoneInput = document.getElementById('phoneNumber');
const connectBtn = document.getElementById('connectBtn');
const connectionStatus = document.getElementById('connectionStatus');
const targetType = document.getElementById('targetType');
const targetNumberInput = document.getElementById('targetNumber');
const targetNumberGroup = document.getElementById('targetNumberGroup');
const groupSelector = document.getElementById('groupSelector');
const groupListContainer = document.getElementById('groupListContainer');
const selectedGroupJid = document.getElementById('selectedGroupJid');
const fetchGroupsBtn = document.getElementById('fetchGroupsBtn');
const msgPrefix = document.getElementById('msgPrefix');
const messageLines = document.getElementById('messageLines');
const fileUpload = document.getElementById('fileUpload');
const delaySec = document.getElementById('delaySec');
const startBtn = document.getElementById('startBtn');
const stopBotBtn = document.getElementById('stopBotBtn');
const logContainer = document.getElementById('logContainer');
const pairingCodeDisplay = document.getElementById('pairingCodeDisplay');
const pairingCodeSpan = document.getElementById('pairingCode');
const taskListEl = document.getElementById('taskList');

let isConnected = false;
let taskLogs = {};

targetType.addEventListener('change', function() {
    if (this.value === 'group') {
        groupSelector.style.display = 'block';
        targetNumberGroup.style.display = 'none';
    } else {
        groupSelector.style.display = 'none';
        targetNumberGroup.style.display = 'block';
    }
});
targetType.dispatchEvent(new Event('change'));

fileUpload.addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => { messageLines.value = ev.target.result; };
    reader.readAsText(file);
});

fetchGroupsBtn.addEventListener('click', () => {
    socket.emit('getGroups');
    addLog('Fetching groups...', 'info');
});

socket.on('groupList', (groups) => {
    groupListContainer.innerHTML = '';
    if (!groups || groups.length === 0) {
        groupListContainer.innerHTML = '<div style="padding:10px; color:#b0a0a5;">No groups found.</div>';
        return;
    }
    groups.forEach(g => {
        const div = document.createElement('div');
        div.className = 'group-item';
        div.textContent = `${g.subject} (${g.id})`;
        div.dataset.jid = g.id;
        div.addEventListener('click', function() {
            document.querySelectorAll('.group-item').forEach(el => el.classList.remove('selected'));
            this.classList.add('selected');
            selectedGroupJid.value = this.dataset.jid;
            addLog(`Selected: ${g.subject}`, 'info');
        });
        groupListContainer.appendChild(div);
    });
});

socket.on('pairingCode', (code) => {
    pairingCodeSpan.textContent = code;
    pairingCodeDisplay.style.display = 'block';
    addLog(`Pairing code: ${code}`, 'success');
});

socket.on('botStatus', (data) => {
    if (data.connected) {
        isConnected = true;
        connectionStatus.textContent = '✅ Connected! Ab target select karke START dabao.';
        connectionStatus.classList.add('connected');
        connectBtn.textContent = '✅ Connected';
        connectBtn.disabled = true;
        startBtn.disabled = false;
        stopBotBtn.style.display = 'inline-block';
        phoneInput.disabled = true;
    } else {
        isConnected = false;
        connectionStatus.textContent = '⚠️ Bot not connected. Pehle pairing karo.';
        connectionStatus.classList.remove('connected');
        connectBtn.textContent = '🔌 Connect & Pair';
        connectBtn.disabled = false;
        startBtn.disabled = true;
        stopBotBtn.style.display = 'none';
        phoneInput.disabled = false;
    }
});

connectBtn.addEventListener('click', function() {
    const phone = phoneInput.value.trim();
    if (!phone) { addLog('Phone number daalo.', 'error'); return; }
    connectBtn.disabled = true;
    connectBtn.textContent = '⏳ Connecting...';
    addLog(`Connecting for ${phone}...`, 'info');
    socket.emit('connectBot', { phoneNumber: phone });
});

socket.on('log', (data) => addLog(data.message, data.type));

function addLog(message, type = 'info') {
    const div = document.createElement('div');
    div.className = `log-entry log-${type}`;
    const ts = new Date().toLocaleTimeString();
    div.textContent = `[${ts}] ${message}`;
    logContainer.appendChild(div);
    logContainer.scrollTop = logContainer.scrollHeight;
    while (logContainer.children.length > 300) logContainer.removeChild(logContainer.firstChild);
}

startBtn.addEventListener('click', function() {
    if (!isConnected) { addLog('Pehle bot connect karo!', 'error'); return; }

    let targetJid = '';
    if (targetType.value === 'number') {
        const num = targetNumberInput.value.trim().replace(/[^0-9]/g, '');
        if (!num) { addLog('Valid target number daalo.', 'error'); return; }
        targetJid = `${num}@s.whatsapp.net`;
    } else {
        targetJid = selectedGroupJid.value.trim();
        if (!targetJid) { addLog('Group select karo.', 'error'); return; }
    }

    const prefix = msgPrefix.value.trim() || '';
    const lines = messageLines.value.split('\n').map(l => l.trim()).filter(Boolean);
    if (lines.length === 0) { addLog('Kam se kam 1 message likho.', 'error'); return; }
    const delay = parseInt(delaySec.value) || 5;

    socket.emit('startTask', { targetJid, messages: lines, prefix, delay });
    addLog('Task creation request sent...', 'info');
});

stopBotBtn.addEventListener('click', () => {
    if (!confirm('Bot disconnect karna hai?')) return;
    socket.emit('stopBot');
});

socket.on('taskCreated', (task) => addLog(`✅ Task created: ${task.id}`, 'success'));
socket.on('taskList', (list) => renderTasks(list));
socket.on('taskUpdate', (task) => {
    const existing = document.querySelector(`[data-task-id="${task.id}"]`);
    if (existing) updateTaskCard(existing, task);
    else socket.emit('getTasks');
});

socket.on('taskLogBroadcast', ({ taskId, message, type, ts }) => {
    if (!taskLogs[taskId]) taskLogs[taskId] = [];
    taskLogs[taskId].push({ message, type, ts });
    if (taskLogs[taskId].length > 100) taskLogs[taskId].shift();
    const logsEl = document.querySelector(`[data-task-id="${taskId}"] .task-logs`);
    if (logsEl && logsEl.classList.contains('open')) appendTaskLog(logsEl, { message, type, ts });
});

function appendTaskLog(el, { message, type, ts }) {
    const div = document.createElement('div');
    div.className = `log-${type}`;
    const time = new Date(ts).toLocaleTimeString();
    div.textContent = `[${time}] ${message}`;
    el.appendChild(div);
    el.scrollTop = el.scrollHeight;
    while (el.children.length > 100) el.removeChild(el.firstChild);
}

function updateTaskCard(card, task) {
    card.className = `task-card ${task.status}`;
    const badge = card.querySelector('.task-badge');
    badge.className = `task-badge badge-${task.status}`;
    badge.textContent = task.status.toUpperCase();
    card.querySelector('.stat-uptime').textContent = formatUptime(task.uptimeMs);
    card.querySelector('.stat-sent').textContent = task.sentCount;
    card.querySelector('.stat-round').textContent = task.roundCount;
    const stopBtn = card.querySelector('.task-stop-btn');
    if (stopBtn) stopBtn.disabled = task.status !== 'running';
}

function formatUptime(ms) {
    const s = Math.floor(ms / 1000);
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

function renderTasks(list) {
    if (!list || list.length === 0) {
        taskListEl.innerHTML = '<div style="color:#b0a0a5; font-size:13px; padding:10px;">No tasks yet.</div>';
        return;
    }
    list.sort((a, b) => {
        if (a.status === 'running' && b.status !== 'running') return -1;
        if (a.status !== 'running' && b.status === 'running') return 1;
        return b.startTime - a.startTime;
    });

    taskListEl.innerHTML = '';
    list.forEach(task => {
        const card = document.createElement('div');
        card.className = `task-card ${task.status}`;
        card.dataset.taskId = task.id;
        card.innerHTML = `
            <div class="task-header">
                <span class="task-id">#${task.id}</span>
                <span class="task-badge badge-${task.status}">${task.status.toUpperCase()}</span>
            </div>
            <div class="task-info">
                <span>🎯 <b>${task.targetJid}</b></span>
                <span>📤 Sent: <b class="stat-sent">${task.sentCount}</b></span>
                <span>🔁 Round: <b class="stat-round">${task.roundCount}</b></span>
                <span>⏱️ Uptime: <b class="stat-uptime">${formatUptime(task.uptimeMs)}</b></span>
                <span>📄 Msgs: <b>${task.totalMessages}</b></span>
            </div>
            <div class="btn-group" style="margin-top:6px;">
                <button class="btn btn-danger btn-sm task-stop-btn" data-id="${task.id}" ${task.status !== 'running' ? 'disabled' : ''}>⏹️ Stop Task</button>
                <button class="btn btn-secondary btn-sm task-logs-btn" data-id="${task.id}">📜 Toggle Logs</button>
            </div>
            <div class="task-logs" data-logs-for="${task.id}"></div>
        `;

        card.querySelector('.task-stop-btn').addEventListener('click', function() {
            const id = this.dataset.id;
            if (!confirm(`Stop task ${id}?`)) return;
            socket.emit('stopTask', { taskId: id });
            addLog(`Stop requested for ${id}`, 'warn');
        });

        card.querySelector('.task-logs-btn').addEventListener('click', function() {
            const logsEl = card.querySelector('.task-logs');
            logsEl.classList.toggle('open');
            if (logsEl.classList.contains('open') && logsEl.children.length === 0) {
                const cached = taskLogs[task.id] || [];
                cached.forEach(l => appendTaskLog(logsEl, l));
                socket.emit('getTaskInfo', { taskId: task.id });
            }
        });

        taskListEl.appendChild(card);
    });
}

setInterval(() => {
    document.querySelectorAll('.task-card.running').forEach(card => {
        const uptimeEl = card.querySelector('.stat-uptime');
        if (!uptimeEl) return;
        const parts = uptimeEl.textContent.split(':').map(Number);
        if (parts.length === 3) {
            let [h, m, s] = parts;
            s++;
            if (s >= 60) { s = 0; m++; }
            if (m >= 60) { m = 0; h++; }
            uptimeEl.textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        }
    });
}, 1000);

socket.on('taskInfo', (info) => {
    if (info.error) return;
    const logsEl = document.querySelector(`[data-logs-for="${info.taskId}"]`);
    if (logsEl && info.logs) {
        logsEl.innerHTML = '';
        info.logs.forEach(l => appendTaskLog(logsEl, l));
    }
});

addLog('✅ RAJ MISHRA Bot Controller ready.', 'success');
</script>
</body>
</html>
